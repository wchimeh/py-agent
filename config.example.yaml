# 配置模板：复制为 config.yaml 并填入真实 api_key（config.yaml 已被 .gitignore 排除，勿上传）
provider: anthropic
model: MiniMax-M3
base_url: https://api.minimaxi.com/anthropic
max_tokens: 4096
api_key: sk-your-key-here

# 重试
request_timeout: 120
retry_max_attempts: 3
retry_base_delay: 1.0
max_turns: 25
token_budget: 500000

# 权限 default acceptEdits bypass
permission_mode: default

# 上下文管理
context_window: 128000   # 模型上下文窗口，按所用模型实际值填
compact_threshold: 0.8   # 估算占比超过即触发压缩
keep_recent: 3           # 压缩时保留最近 N 条消息

# 可观测性
journal: true            # 结构化 JSONL 日志到 .agent/logs/
journal_keep_days: 30    # 日志按天轮转保留天数（0 = 不清理）
save_session: true       # 任务结束自动保存会话到 .agent/sessions/

# 工作区
workspace_root: ""   # 留空 = 启动目录；Write/Edit 只允许写此目录内（硬边界，bypass 也不例外）

# 沙箱（仅罩 Bash 工具；文件工具走宿主路径硬限 + 权限门）
sandbox:
  mode: none                 # none = 宿主直接执行；docker = 长驻受限容器内执行（需 Docker）
  image: python:3.12-slim
  trusted: false             # docker 模式下非危险 Bash 免审批；危险命令模式仍询问
  memory: 2g
  cpus: 2.0

# 子代理（Agent 工具：独立上下文跑检索/取证类任务，只回灌结论）
subagent:
  max_turns: 15            # 子代理单次任务回合上限
  allow_bash: false        # 子代理可用 Bash（仍受主会话"总是允许"记忆约束）
  token_slice: 100000      # 子代理单体 token 硬限（与主会话共用进程级总闸 token_budget）
  max_parallel: 3          # 同回合子代理并发上限

# 团队编排（/team：leader 用 Spawn 派 worker 并发干活，跑完回灌报告）
team:
  max_workers: 3           # 同时在跑 worker 上限（与 subagent.max_parallel 取小生效）

# MCP 客户端（外部工具生态：远端工具以 mcp__<server>__<tool> 注入，权限门逐次询问）
