[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "1.0.0"
description = "类 Claude Code 的终端编码 Agent：双协议接入、工具调用、上下文压缩、权限门控、流式输出"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.5.0",
    "openai>=3.13.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13.5",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff==0.16.7", "httpx>=0.28.1", "pytest-cov>=6.0"]

[project.scripts]
agent = "main:start_loop"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-data]
"agent.prompts" = ["*.md"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# 架构性排除（不 select 即永不触发）：BLE001 裸 except=错误回灌设计；
# PLW1510 subprocess 无 check=返回码回灌信息；DTZ005 本地时间=日志有意选择
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文项目：全角标点（，：；）在注释/字符串/文档里被误报为歧义字符
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.coverage.run]
branch = true
# 门禁阈值 85：2026-09-16 实测基线 88%（main.py 23% 属 REPL 交互主体，预期不可测）
